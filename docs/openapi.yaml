  /api/v1/admin/user-analytics:
    get:
      tags: [Admin]
      summary: Get aggregate user, usage, login-time, deck, and collection analytics.
      description: ADMIN-only. Excludes utility accounts and returns no user identifiers. Usage is cumulative API request share, not time spent.
      responses:
        '200':
          description: Aggregate user, usage, login-time, deck, and collection analytics snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [generatedAt, acquisitionPeriodStart, standardUserAccounts, newStandardAccounts, loggedInLast24Hours, loggedInLast30Days, inactiveOver30Days, googleAuthUsers, recordedLoginUsers, signupMonths, loginRecency, siteSectionUsage, loginTimeDistribution, deckStatistics, collectionStatistics]
                    properties:
                      generatedAt: { type: string, format: date-time }
                      acquisitionPeriodStart: { type: string, format: date-time }
                      standardUserAccounts: { type: integer }
                      newStandardAccounts: { type: integer }
                      loggedInLast24Hours: { type: integer, description: Unique standard accounts whose latest successful sign-in is within the rolling 24-hour window. }
                      loggedInLast30Days:
                        type: object
                        properties:
                          count: { type: integer }
                          percentage: { type: integer }
                      inactiveOver30Days: { type: integer, description: Standard accounts with no recorded sign-in or a latest sign-in older than 30 rolling days. }
                      googleAuthUsers:
                        type: object
                        properties:
                          count: { type: integer }
                          percentage: { type: integer }
                      recordedLoginUsers: { type: integer }
                      signupMonths:
                        type: array
                        items:
                          type: object
                          properties:
                            month: { type: string, example: '2026-08' }
                            count: { type: integer }
                            recent: { type: boolean }
                            partial: { type: boolean }
                      loginRecency:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string }
                            label: { type: string }
                            count: { type: integer }
                      siteSectionUsage:
                        type: object
                        required: [totalRequests, sections]
                        properties:
                          totalRequests: { type: integer, format: int64 }
                          sections:
                            type: array
                            items:
                              type: object
                              required: [key, label, requests, percentage]
                              properties:
                                key: { type: string, enum: [home, database, decks, collection] }
                                label: { type: string }
                                requests: { type: integer, format: int64 }
                                percentage: { type: number, format: float }
                      loginTimeDistribution:
                        type: object
                        required: [timeZone, windowStart, totalLogins, allTimeTotalLogins, hours]
                        properties:
                          timeZone: { type: string, enum: [America/Los_Angeles] }
                          windowStart: { type: string, format: date-time, description: Start of the rolling 24-hour login window. }
                          totalLogins: { type: integer, format: int64, description: Successful standard-user session starts in the rolling 24-hour window. }
                          allTimeTotalLogins: { type: integer, format: int64, description: Successful standard-user session starts across all available aggregate counter history. }
                          hours:
                            type: array
                            minItems: 24
                            maxItems: 24
                            items:
                              type: object
                              required: [hour, label, count, allTimeCount]
                              properties:
                                hour: { type: integer, minimum: 0, maximum: 23 }
                                label: { type: string, example: '1 PM' }
                                count: { type: integer, format: int64, description: Rolling-24-hour count for this Pacific hour. }
                                allTimeCount: { type: integer, format: int64, description: Count across all available aggregate counter history for this Pacific hour. }
                      deckStatistics:
                        type: object
                        required: [totalDecks, legalDecks, legalPercentage, limitedDecks, limitedPercentage, averageDecksPerUser, averageLegalDecksPerUser]
                        properties:
                          totalDecks: { type: integer }
                          legalDecks: { type: integer }
                          legalPercentage: { type: number, format: float }
                          limitedDecks: { type: integer }
                          limitedPercentage: { type: number, format: float }
                          averageDecksPerUser: { type: number, format: float }
                          averageLegalDecksPerUser: { type: number, format: float }
                      collectionStatistics:
                        type: object
                        required: [usersWithNonZeroCollections, adoptionPercentage, averageCardsPerUser, averageCardsPerCollector]
                        properties:
                          usersWithNonZeroCollections: { type: integer }
                          adoptionPercentage: { type: number, format: float }
                          averageCardsPerUser: { type: number, format: float }
                          averageCardsPerCollector: { type: number, format: float }
        '403': { description: Not ADMIN (ADMIN_REQUIRED) }
        '500': { description: Analytics query failed (ADMIN_USER_ANALYTICS_ERROR) }
  /api/v1/admin/biz-ops-dashboard:
    get:
      tags: [Admin]
      summary: Get the AWS cost business operations dashboard.
      description: ADMIN-only. Returns chart-ready aggregates from the committed AWS cost ledger without source identifiers or raw rows.
      responses:
        '200':
          description: AWS cost dashboard snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [generatedAt, currency, coverage, currentMonth, yearToDate, monthlyCosts, serviceCosts, serviceTrends, latestWeeklyDigest]
                    properties:
                      generatedAt: { type: string, format: date-time }
                      currency: { type: string, example: USD }
                      coverage: { type: object }
                      currentMonth: { type: object }
                      yearToDate: { type: object }
                      monthlyCosts:
                        type: array
                        items: { type: object }
                      serviceCosts:
                        type: array
                        items: { type: object }
                      serviceTrends:
                        type: array
                        items:
                          type: object
                          required: [service, currentAmount, points]
                          properties:
                            service: { type: string }
                            currentAmount: { type: number, format: double }
                            points:
                              type: array
                              items:
                                type: object
                                required: [month, amount, estimated]
                                properties:
                                  month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
                                  amount: { type: number, format: double }
                                  estimated: { type: boolean }
                      latestWeeklyDigest:
                        nullable: true
                        type: object
        '401': { description: Authentication required }
        '403': { description: Not ADMIN (ADMIN_REQUIRED) }
        '500': { description: Ledger read or aggregation failed (ADMIN_BIZ_OPS_DASHBOARD_ERROR) }
