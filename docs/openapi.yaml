  /api/v1/saved-database-views:
    get:
      tags: [Saved Database Views]
      summary: List the current user's saved database views.
      responses:
        '200':
          description: Pinned-first deterministic list and quota.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/SavedDatabaseViewList' } }
        '401': { description: Unauthenticated }
        '403': { description: Saved Views eligibility denied }
    post:
      tags: [Saved Database Views]
      summary: Save the current database state as a new unpinned view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, viewState]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                viewState: { $ref: '#/components/schemas/SavedDatabaseViewStateV1' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/SavedDatabaseViewMutation' } }
        '400': { description: Invalid name or state }
        '403': { description: Saved Views eligibility denied }
        '409': { description: 50-view limit reached }
  /api/v1/saved-database-views/bulk-delete:
    post:
      tags: [Saved Database Views]
      summary: Atomically delete selected current-user-owned views.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted and non-enumerating not-found counts.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/SavedDatabaseViewDeleteResult' } }
        '400': { description: Invalid ID list }
        '403': { description: Saved Views eligibility denied }
  /api/v1/saved-database-views/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Saved Database Views]
      summary: Rename and/or pin a current-user-owned view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                isPinned: { type: boolean }
      responses:
        '200': { description: Updated metadata and quota }
        '400': { description: Invalid metadata }
        '403': { description: Saved Views eligibility denied }
        '404': { description: Not found or not owned }
    delete:
      tags: [Saved Database Views]
      summary: Delete one current-user-owned view.
      responses:
        '200': { description: Deleted and current quota }
        '403': { description: Saved Views eligibility denied }
        '404': { description: Not found or not owned }
  /api/v1/decks/validate:
