name: Build, Test, and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: overpower-deckbuilder
  EC2_INSTANCE_ID: i-04493611b99785f28

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run linting
      run: npx eslint src --ext .ts --max-warnings 0

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        # Short retention breaks "Re-run failed jobs" once GitHub deletes the artifact.
        retention-days: 14

  knip:
    name: Knip (unused code scan)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Knip (unused code scan)
      run: npm run find:unused:ci

  # Checkout can occasionally be slow on some runners; re-running the job usually helps.
  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Jest timing
      uses: actions/cache@v4
      with:
        path: /tmp/jest-cache
        key: jest-unit-${{ runner.os }}-${{ hashFiles('tests/config/jest.ci.config.js', 'package-lock.json') }}
        restore-keys: |
          jest-unit-${{ runner.os }}-

    - name: Run unit tests (shard ${{ matrix.shard }}/8)
      run: npx jest --config tests/config/jest.ci.config.js --shard=${{ matrix.shard }}/8
      timeout-minutes: 10

  unit-coverage:
    name: Unit Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests with coverage
      run: npx jest --config tests/config/jest.ci.config.js --coverage
      timeout-minutes: 15

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v3
      with:
        directory: coverage/unit/
        flags: unit
        fail_ci_if_error: false

  semgrep:
    name: Semgrep (SQL injection patterns)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Semgrep
      run: python -m pip install --upgrade pip semgrep

    - name: Semgrep scan (human-readable)
      run: semgrep scan --config .semgrep.yml src tests --exclude src/resources --error

    - name: Semgrep scan (JSON artifact)
      if: always()
      run: semgrep scan --config .semgrep.yml src tests --exclude src/resources --json --output semgrep.json || true

    - name: Upload Semgrep report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep.json

  soc2-compliance:
    name: SOC 2 Compliance Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Run gitleaks (secret detection)
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ''

    - name: Run SOC 2 technical compliance checks
      run: bash scripts/soc2-compliance-checks.sh

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Trivy
      # The apt-repo GPG key ring broke in 2026-04 (NO_PUBKEY
      # E9D0A3616276FA6C from noble InRelease), so we install via the
      # upstream install script which fetches the signed binary directly
      # from GitHub releases and bypasses apt entirely.
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin
        trivy --version

    - name: Run Trivy vulnerability scanner
      run: |
        echo "🔍 Running Trivy with ignorefile: .trivyignore"
        echo "📋 Contents of .trivyignore:"
        cat .trivyignore
        echo ""
        echo "🚀 Starting scan..."
        trivy fs \
          --ignorefile .trivyignore \
          --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
          --exit-code 1 \
          --ignore-unfixed \
          --scanners vuln \
          .

    - name: Run Trivy (JSON artifact)
      if: always()
      run: |
        trivy fs \
          --ignorefile .trivyignore \
          --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
          --ignore-unfixed \
          --scanners vuln \
          --format json \
          --output trivy-report.json \
          . || true

    - name: Upload Trivy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-report.json

  frontend-build:
    name: Build v2 Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
    - name: Checkout frontend code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        # The SPA shares the tournament threat cap with the backend.
        sparse-checkout: |
          frontend
          src/constants

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm --prefix frontend ci

    - name: Build v2 frontend (React SPA)
      run: |
        echo "🏗️ Building v2 React SPA (frontend/) for production cutover..."
        npm --prefix frontend run build
        if test -f frontend/dist/index.html; then
          echo "✅ frontend/dist/index.html built"
        else
          echo "❌ frontend/dist/index.html missing after build — aborting (would not cut over to v2)"
          exit 1
        fi

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        # Match the backend artifact so failed deploy jobs can be re-run.
        retention-days: 14

  # Checkout can occasionally be slow on some runners; sparse-checkout skips images to reduce fetch size.
  # Integration Tests - Matrix (consolidated like unit-tests)
  integration-tests:
    name: ${{ matrix.category }}
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Must exceed the slowest matrix step timeout + setup (migrate, npm ci, Flyway).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: Security
            slug: security
            script: test:integration:security
            args: ""
            timeout: 25
          - category: AuthZ Security
            slug: authz-security
            script: test:integration
            args: "tests/integration/security/session-impersonation-security.test.ts tests/integration/security/debug-endpoints-access.test.ts tests/integration/security/cross-user-mutation-attempts.test.ts"
            timeout: 20
          - category: Authentication
            slug: auth
            script: test:integration
            args: "tests/integration/bcrypt-authentication.test.ts tests/integration/authentication*.test.ts tests/integration/auth-*.test.ts"
            timeout: 15
          - category: Guest
            slug: guest
            script: test:integration
            args: "tests/integration/guest-deck-editing.test.ts tests/integration/guest-read-only-layout-integration.test.ts tests/integration/guest-add-to-deck-buttons.test.ts tests/integration/guest-deck-deletion.test.ts tests/integration/guestLogin.test.ts tests/integration/autoGuestLogin.test.ts"
            timeout: 15
          - category: Search
            slug: search
            script: test:integration
            args: "tests/integration/deck-editor-search-bar-basic.test.ts tests/integration/deck-editor-search-visible-results.test.ts tests/integration/deck-editor-search-results-visible.test.ts tests/integration/search-functionality-integration.test.ts tests/integration/ally-search-integration.test.ts"
            timeout: 15
          - category: Filtering
            slug: filtering
            script: test:integration
            args: "tests/integration/stat-type-filtering-integration.test.ts tests/integration/stat-type-filtering-time-traveler.test.ts tests/integration/stat-type-filtering-john-carter.test.ts tests/integration/power-card-filtering-time-traveler.test.ts tests/integration/power-card-filtering-john-carter.test.ts"
            timeout: 15
          - category: Deck Building & Management
            slug: deck-building
            script: test:integration
            args: "tests/integration/deckBuilding.test.ts tests/integration/deckManagement.test.ts tests/integration/deck-navigation-flow.test.ts tests/integration/deck-editor-search-new-deck.test.ts tests/integration/deckClickability.test.ts tests/integration/limitedDeckIntegration.test.ts tests/integration/limitedDeckSaveAndLoad.test.ts tests/integration/limitedDeckSimpleIntegration.test.ts"
            timeout: 15
          - category: Deck Editing & Validation
            slug: deck-editing
            script: test:integration
            args: "tests/integration/deckEditabilityBrowser.test.ts tests/integration/deckEditabilityHTML.test.ts tests/integration/deckTitleDescriptionEditability.test.ts tests/integration/deck-validation-unusable-cards.test.ts"
            timeout: 15
          - category: Deck Security Ownership
            slug: deck-security-ownership
            script: test:integration:deck-security-ownership
            args: ""
            timeout: 10
          - category: Deck Security Save
            slug: deck-security-save
            script: test:integration:deck-security-save
            args: ""
            timeout: 10
          - category: Deck Security Frontend
            slug: deck-security-frontend
            script: test:integration:deck-security-frontend
            args: ""
            timeout: 10
          - category: Game Logic Character Validation
            slug: game-logic-character-validation
            script: test:integration:game-logic-character-validation
            args: ""
            timeout: 15
          - category: Game Logic Character Layout
            slug: game-logic-character-layout
            script: test:integration:game-logic-character-layout
            args: ""
            timeout: 25
          - category: Game Logic Character Threat
            slug: game-logic-character-threat
            script: test:integration:game-logic-character-threat
            args: ""
            timeout: 25
          - category: Reserve
            slug: reserve
            script: test:integration
            args: "tests/integration/reserve-character-integration.test.ts tests/integration/reserve-character-loading-integration.test.ts tests/integration/reserve-character-simple.test.ts tests/integration/reserve-character-threat-integration.test.ts tests/integration/reserve-character-threat-persistence.test.ts tests/integration/guest-reserve-character-integration.test.ts"
            timeout: 15
          - category: Game Logic Power & Teamwork
            slug: game-logic-power-teamwork
            script: test:integration:game-logic-power-teamwork
            args: ""
            timeout: 10
          - category: UI/UX & Frontend
            slug: ui
            script: test:integration
            args: "tests/integration/*HTML*.test.ts tests/integration/*Browser*.test.ts tests/integration/*Clickability*.test.ts tests/integration/*Editability*.test.ts tests/integration/*Layout*.test.ts tests/integration/*Navigation*.test.ts tests/integration/*Tooltip*.test.ts tests/integration/toast-notification-role-based.test.ts tests/integration/global-nav-integration.test.ts tests/integration/view-button-readonly.test.ts"
            timeout: 15
          - category: User Management
            slug: user-management
            script: test:integration
            args: "tests/integration/create*.test.ts tests/integration/user*.test.ts tests/integration/cross*.test.ts tests/integration/change*.test.ts tests/integration/username*.test.ts"
            timeout: 15
          - category: Collection
            slug: collection
            script: test:integration
            args: "tests/integration/collection/collection-workflow.test.ts tests/integration/collection/collection-api-endpoints.test.ts tests/integration/collection/collection-database-persistence.test.ts tests/integration/collection/collection-cross-user-isolation.test.ts tests/integration/collection/collection-sql-injection-hardening.test.ts tests/integration/collection/collection-admin-access.test.ts tests/integration/collection/collection-error-handling.test.ts"
            timeout: 20
          - category: Remaining
            slug: remaining
            script: test:integration
            args: "tests/integration/new*.test.ts tests/integration/auto*.test.ts tests/integration/database*.test.ts tests/integration/alternate*.test.ts tests/integration/card-duplication-bug.test.ts"
            timeout: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: overpower
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1337:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist artifact
      id: download-dist
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Build dist if artifact missing
      if: steps.download-dist.outcome == 'failure'
      run: npm run build

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 60s bash -c 'until pg_isready -h localhost -p 1337 -U postgres; do sleep 1; done'
        echo "PostgreSQL is ready!"

    - name: Cache Flyway
      id: flyway-cache
      uses: actions/cache@v4
      with:
        path: /opt/flyway
        key: flyway-9.22.3-linux-x64

    - name: Install Flyway
      if: steps.flyway-cache.outputs.cache-hit != 'true'
      run: |
        echo "Installing Flyway..."
        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.3/flyway-commandline-9.22.3-linux-x64.tar.gz -o flyway.tar.gz
        tar -xzf flyway.tar.gz
        sudo mv flyway-9.22.3 /opt/flyway
        sudo chmod +x /opt/flyway/flyway
        echo "✅ Flyway installed successfully!"

    - name: Add Flyway to PATH
      run: |
        echo "/opt/flyway" >> $GITHUB_PATH
        /opt/flyway/flyway --version

    - name: Run database migrations
      run: |
        export DATABASE_URL="postgresql://postgres:password@localhost:1337/overpower"
        /opt/flyway/flyway --version
        npm run migrate

    - name: Run ${{ matrix.category }} Integration Tests
      run: |
        echo "Running ${{ matrix.category }} Integration Tests..."
        if [ -z "${{ matrix.args }}" ]; then
          npm run ${{ matrix.script }} -- \
            --verbose --testTimeout=60000 --maxWorkers=2 2>&1 | tee ${{ matrix.slug }}-test-output.log || {
            echo "❌ ${{ matrix.category }} tests failed, checking output..."
            cat ${{ matrix.slug }}-test-output.log | tail -100
            exit 1
          }
        else
          npm run ${{ matrix.script }} -- \
            ${{ matrix.args }} \
            --verbose --testTimeout=60000 --maxWorkers=2 2>&1 | tee ${{ matrix.slug }}-test-output.log || {
            echo "❌ ${{ matrix.category }} tests failed, checking output..."
            cat ${{ matrix.slug }}-test-output.log | tail -100
            exit 1
          }
        fi
        echo "✅ ${{ matrix.category }} tests completed successfully!"
      timeout-minutes: ${{ matrix.timeout }}
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:1337/overpower

  build-docker:
    name: Build & Push Docker Image
    needs: [build, frontend-build, unit-tests, knip, semgrep, trivy, soc2-compliance, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Two commits preserve the HEAD~1 changed-file verification without
        # downloading the repository's multi-gigabyte history.
        fetch-depth: 2
        # Card images are synced to S3 by sync-images and are already excluded
        # from the Docker context by .dockerignore.
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist artifact
      id: download-dist-docker
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Build dist if artifact missing
      if: steps.download-dist-docker.outcome == 'failure'
      run: npm run build

    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Verify Git Information
      run: |
        echo "🔍 VERIFYING GIT INFORMATION:"
        echo "Current branch: $(git branch --show-current)"
        echo "Current commit SHA: $(git rev-parse HEAD)"
        echo "Expected commit SHA: ${{ github.sha }}"
        echo "Commit message: $(git log -1 --pretty=format:'%s')"
        echo "Commit author: $(git log -1 --pretty=format:'%an <%ae>')"
        echo "Commit date: $(git log -1 --pretty=format:'%ad')"
        echo "Files changed in this commit:"
        git diff --name-only HEAD~1 HEAD
        if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
          echo "❌ Checked-out commit does not match expected ${{ github.sha }}"
          exit 1
        fi
        echo "✅ Checked-out commit matches ${{ github.sha }}"
        echo "=== END GIT VERIFICATION ==="
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        DOCKER_BUILDKIT: 1
      run: |
        echo "🚀 Starting Docker build with layer caching..."
        echo "🔍 PRE-BUILD VERIFICATION:"
        echo "Building from commit: $(git rev-parse HEAD)"
        echo "Building from branch: $(git branch --show-current)"
        echo "Git commit message: $(git log -1 --pretty=format:'%s')"
        echo "Git commit author: $(git log -1 --pretty=format:'%an <%ae>')"
        echo "Git commit date: $(git log -1 --pretty=format:'%ad')"
        echo "Checking source files before build:"
        if grep -q "replaceAllCardsInDeck" src/database/PostgreSQLDeckRepository.ts; then
          echo "✅ Card duplication bug fix found in source files"
        else
          echo "❌ Card duplication bug fix NOT found in source files"
          exit 1
        fi
        if test -f frontend/dist/index.html; then
          echo "✅ v2 SPA build (frontend/dist/index.html) found in source files"
        else
          echo "❌ v2 SPA build NOT found — the 'Build v2 frontend' step must run before docker build"
          exit 1
        fi
        
        BUILD_TIMESTAMP=$(date +%s)
        docker build --platform linux/amd64 \
          --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg GIT_COMMIT="${{ github.sha }}" \
          --build-arg GIT_SHORT_COMMIT="$(git rev-parse --short HEAD)" \
          --build-arg GIT_BRANCH="$(git branch --show-current)" \
          --build-arg GIT_COMMIT_DATE="$(git log -1 --format=%ci)" \
          --build-arg GIT_COMMIT_MESSAGE="$(git log -1 --format=%s)" \
          --build-arg GIT_COMMIT_AUTHOR="$(git log -1 --format=%an)" \
          --build-arg GIT_COMMIT_EMAIL="$(git log -1 --format=%ae)" \
          --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        echo "✅ Docker build completed"
        
        echo "🏷️ Tagging image..."
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "✅ Image tagged"
        
        echo "📋 Verifying build contents..."
        echo "📋 Verifying v2 SPA is baked into the image..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ls -la /app/frontend/dist/index.html
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Verify Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔍 Verifying critical files in Docker image..."
        echo "Image built: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        echo "Testing v2 SPA build (frontend/dist/index.html)..."
        if docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG test -f /app/frontend/dist/index.html; then
          echo "✅ v2 SPA index.html found"
        else
          echo "❌ v2 SPA index.html MISSING"
          exit 1
        fi

        echo "Verifying compiled backend entrypoint..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG test -f /app/dist/index.js

        echo "Verifying compiled deck-card replacement logic..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          grep -q "replaceAllCardsInDeck" /app/dist/api/services/deckCardsService.js

        echo "Verifying exact commit metadata..."
        ACTUAL_COMMIT=$(docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          sh -c 'printf %s "$GIT_COMMIT"')
        if [ "$ACTUAL_COMMIT" != "${{ github.sha }}" ]; then
          echo "❌ Image commit $ACTUAL_COMMIT does not match expected ${{ github.sha }}"
          exit 1
        fi
        echo "✅ Image contains the expected commit $ACTUAL_COMMIT"

        echo "Verifying build timestamp metadata..."
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          grep -Eq '^Build timestamp: [0-9]+$' /tmp/build_info.txt

    - name: Push Docker Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "📤 Pushing images to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "✅ Images pushed to ECR"

  sync-images:
    name: Sync Card Images to S3
    needs: [build, unit-tests, knip, semgrep, trivy, soc2-compliance, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate card image thumbnails
      run: |
        echo "🖼️ Generating card image thumbnails..."
        npm run generate:thumbnails
        echo "✅ Thumbnails generated"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Validate S3 assets bucket secret
      run: |
        if [ -z "${{ secrets.AWS_S3_ASSETS_BUCKET }}" ]; then
          echo "::error::AWS_S3_ASSETS_BUCKET secret is not set. Add it in repo Settings → Secrets and variables → Actions. Value: \`cd infra && terraform output -raw assets_bucket_name\`"
          exit 1
        fi

    - name: Sync card images to S3
      run: |
        echo "📦 Syncing card images to S3..."
        aws s3 sync src/resources/cards/images/ \
          s3://${{ secrets.AWS_S3_ASSETS_BUCKET }}/src/resources/cards/images/ \
          --delete \
          --cache-control "public, max-age=31536000, immutable"
        echo "✅ Card images synced to S3"

    - name: Sync UI image assets to S3
      run: |
        echo "📦 Syncing UI image assets to S3..."
        aws s3 sync src/resources/images/ \
          s3://${{ secrets.AWS_S3_ASSETS_BUCKET }}/src/resources/images/ \
          --delete \
          --cache-control "public, max-age=31536000, immutable"
        echo "✅ UI image assets synced to S3"

    - name: Verify S3 sync (ensure bucket has card images)
      run: |
        COUNT=$(aws s3 ls s3://${{ secrets.AWS_S3_ASSETS_BUCKET }}/src/resources/cards/images/ --recursive 2>/dev/null | wc -l)
        if [ "$COUNT" -lt 1 ]; then
          echo "::error::S3 bucket has no objects under src/resources/cards/images/. Sync may have failed or AWS_S3_ASSETS_BUCKET may not match the Terraform bucket (run: cd infra && terraform output -raw assets_bucket_name)"
          exit 1
        fi
        echo "✅ Verified $COUNT objects in S3 under src/resources/cards/images/"

    - name: Verify S3 sync (UI image assets)
      run: |
        UI_IMAGE_COUNT=$(aws s3 ls s3://${{ secrets.AWS_S3_ASSETS_BUCKET }}/src/resources/images/ --recursive 2>/dev/null | wc -l)
        if [ "$UI_IMAGE_COUNT" -lt 1 ]; then
          echo "::error::S3 bucket has no objects under src/resources/images/. UI image sync may have failed."
          exit 1
        fi
        echo "✅ Verified $UI_IMAGE_COUNT objects in S3 under src/resources/images/"

  run-migrations:
    name: Run Production Migrations
    needs: [build-docker, sync-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          /*
          !/src/resources/cards/images/
        sparse-checkout-cone-mode: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Create environment file on EC2
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "mkdir -p /opt/app",
            "rm -f /opt/app/.env",
            "echo DATABASE_URL=postgresql://postgres:TempPassword123!@op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require > /opt/app/.env",
            "echo DB_HOST=op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com >> /opt/app/.env",
            "echo DB_PORT=5432 >> /opt/app/.env",
            "echo DB_NAME=overpower >> /opt/app/.env",
            "echo DB_USER=postgres >> /opt/app/.env",
            "echo DB_PASSWORD=TempPassword123! >> /opt/app/.env",
            "echo DB_USERNAME=postgres >> /opt/app/.env",
            "echo NODE_ENV=production >> /opt/app/.env",
            "echo PORT=3000 >> /opt/app/.env",
            "echo NODE_TLS_REJECT_UNAUTHORIZED=0 >> /opt/app/.env",
            "echo FLYWAY_URL=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require >> /opt/app/.env",
            "echo FLYWAY_USER=postgres >> /opt/app/.env",
            "echo FLYWAY_PASSWORD=TempPassword123! >> /opt/app/.env"
          ]' \
          --output text --query 'Command.CommandId')
        echo "Waiting for .env creation (command $COMMAND_ID)..."
        bash .github/scripts/wait-ssm-command.sh "$COMMAND_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Create .env on EC2"

    - name: Append Firebase config to .env
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://.github/scripts/append-firebase-env.json \
          --output text --query 'Command.CommandId')
        echo "Waiting for Firebase config append (command $COMMAND_ID)..."
        bash .github/scripts/wait-ssm-command.sh "$COMMAND_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Append Firebase config"

    - name: Append CDN_BASE_URL to .env
      run: |
        CDN_BASE_URL=$(aws ssm get-parameter \
          --name /op-deckbuilder/dev/app/cdn_base_url \
          --region us-west-2 \
          --query Parameter.Value \
          --output text)
        if [ -z "$CDN_BASE_URL" ]; then
          echo "ERROR: CDN_BASE_URL SSM parameter is empty — aborting deployment"
          exit 1
        fi
        echo "CDN_BASE_URL fetched: $CDN_BASE_URL"
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[\"echo 'CDN_BASE_URL=${CDN_BASE_URL}' >> /opt/app/.env\"]" \
          --output text --query 'Command.CommandId')
        echo "Waiting for SSM command $COMMAND_ID to complete..."
        bash .github/scripts/wait-ssm-command.sh "$COMMAND_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Append CDN_BASE_URL"

    - name: Append JWT_SECRET to .env (SSM, for /api/v1)
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://.github/scripts/append-jwt-env.json \
          --output text --query 'Command.CommandId')
        echo "Waiting for JWT .env append (command $COMMAND_ID)..."
        bash .github/scripts/wait-ssm-command.sh "$COMMAND_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Append JWT_SECRET" || {
          echo "::error::Failed to append JWT_SECRET from SSM. Create /op-deckbuilder/dev/app/jwt_secret (SecureString) in us-west-2."
          exit 1
        }

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Run Production Database Migrations
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        ECR_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
        FLYWAY_JDBC="jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require"
        echo "Running production Flyway migrate via Docker ($ECR_URI:$IMAGE_TAG)..."
        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 1200 \
          --parameters "commands=[
            \"set -e\",
            \"echo '=== Production database migrations (Docker Flyway) ==='\",
            \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URI\",
            \"timeout 480 docker pull $ECR_URI:$IMAGE_TAG\",
            \"docker run --rm --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=$FLYWAY_JDBC -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations repair\",
            \"docker run --rm --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=$FLYWAY_JDBC -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations migrate\",
            \"echo 'Production database migrations completed successfully'\"
          ]" \
          --output text --query 'Command.CommandId')
        echo "SSM migration command ID: $CMD_ID"
        echo "Polling migration status (max 1200s; docker pull + Flyway can exceed the default 100s CLI waiter)..."
        bash .github/scripts/wait-ssm-command.sh "$CMD_ID" ${{ env.EC2_INSTANCE_ID }} 240 "Production database migrations" || {
          echo "::error::Production database migrations failed on EC2."
          exit 1
        }
        INV=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ env.EC2_INSTANCE_ID }})
        echo "$INV" | jq -r '.StandardOutputContent'

    - name: Verify Migration Results
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        ECR_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
        FLYWAY_JDBC="jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require"
        echo "Verifying Flyway schema via Docker ($ECR_URI:$IMAGE_TAG)..."
        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 600 \
          --parameters "commands=[
            \"set -e\",
            \"echo '=== Verify migration status (Docker Flyway) ==='\",
            \"docker run --rm --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=$FLYWAY_JDBC -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations info\",
            \"docker run --rm --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=$FLYWAY_JDBC -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations validate\",
            \"echo 'Database validation successful'\"
          ]" \
          --output text --query 'Command.CommandId')
        echo "SSM verify command ID: $CMD_ID"
        echo "Polling verify status (max 1200s)..."
        bash .github/scripts/wait-ssm-command.sh "$CMD_ID" ${{ env.EC2_INSTANCE_ID }} 240 "Verify migration results" || {
          echo "::error::Production database validation failed on EC2."
          exit 1
        }
        INV=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ env.EC2_INSTANCE_ID }})
        echo "$INV" | jq -r '.StandardOutputContent'

  deploy:
    name: Deploy to Production
    needs: [run-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production-deploy-${{ github.ref }}
      cancel-in-progress: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Verify CDN_BASE_URL in .env on EC2
      run: |
        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "if ! grep -q \"^CDN_BASE_URL=\" /opt/app/.env 2>/dev/null; then echo \"ERROR: /opt/app/.env missing CDN_BASE_URL (run-migrations must append it)\"; exit 1; fi",
            "echo \"CDN_BASE_URL is set in /opt/app/.env\""
          ]' \
          --output text --query 'Command.CommandId')
        bash .github/scripts/wait-ssm-command.sh "$CMD_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Verify CDN_BASE_URL in .env" || {
          echo "::error::CDN_BASE_URL not found in /opt/app/.env. Deck selection images will not load from CDN."
          exit 1
        }

    - name: Verify JWT_SECRET in .env on EC2
      run: |
        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "if ! grep -q \"^JWT_SECRET=\" /opt/app/.env 2>/dev/null; then echo \"ERROR: /opt/app/.env missing JWT_SECRET (run-migrations must append from SSM)\"; exit 1; fi",
            "echo \"JWT_SECRET is set in /opt/app/.env (value not shown)\""
          ]' \
          --output text --query 'Command.CommandId')
        bash .github/scripts/wait-ssm-command.sh "$CMD_ID" ${{ env.EC2_INSTANCE_ID }} 36 "Verify JWT_SECRET in .env" || {
          echo "::error::JWT_SECRET not found in /opt/app/.env. API v1 will not start in production."
          exit 1
        }

    - name: Blue-Green Deploy
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        ECR_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
        EXPECTED_COMMIT="$IMAGE_TAG"
        echo "Sending blue-green deploy command (fire-and-forget)..."
        echo "ECR URI: $ECR_URI"
        echo "Deploying image tag: $IMAGE_TAG"

        CMD_ID=$(aws ssm send-command \
          --instance-ids ${{ env.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 1200 \
          --parameters "commands=[
            \"set -e\",
            \"echo '=== Blue-Green Deploy Start ===' \",
            \"docker stop overpower-app-new 2>/dev/null || true\",
            \"docker rm overpower-app-new 2>/dev/null || true\",
            \"CURRENT_PORT=\$(cat /opt/app/active_port 2>/dev/null || echo '3000')\",
            \"if [ \\\"\$CURRENT_PORT\\\" = \\\"3000\\\" ]; then NEW_PORT=3001; else NEW_PORT=3000; fi\",
            \"echo \\\"Switching: port \$CURRENT_PORT -> \$NEW_PORT\\\"\",
            \"echo '--- Step 1: Pull new image ---'\",
            \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URI\",
            \"timeout 480 docker pull $ECR_URI:$IMAGE_TAG\",
            \"echo 'Image pulled.'\",
            \"docker image inspect $ECR_URI:$IMAGE_TAG --format '{{index .RepoDigests 0}}' || true\",
            \"echo '--- Step 1b: Apply DB migrations before new app boot (SKIP_MIGRATIONS on app) ---'\",
            \"docker run --rm --env-file /opt/app/.env --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations repair\",
            \"docker run --rm --env-file /opt/app/.env --entrypoint /usr/local/bin/flyway $ECR_URI:$IMAGE_TAG -url=jdbc:postgresql://op-deckbuilder-postgres.cdaeyc0ik7bu.us-west-2.rds.amazonaws.com:5432/overpower?sslmode=require -user=postgres -password=TempPassword123! -locations=filesystem:/app/migrations migrate\",
            \"echo '--- Step 2: Start new container on idle port ---'\",
            \"docker stop overpower-app-new || true\",
            \"docker rm overpower-app-new || true\",
            \"docker run -d --name overpower-app-new --restart unless-stopped -p \$NEW_PORT:3000 --env-file /opt/app/.env -e SKIP_MIGRATIONS=true $ECR_URI:$IMAGE_TAG\",
            \"docker inspect overpower-app-new --format '{{.Image}}' || true\",
            \"echo \\\"New container started on port \$NEW_PORT\\\"\",
            \"echo '--- Step 3a: Liveness (process listening, no DB) ---'\",
            \"LIVE_ATTEMPTS=0\",
            \"MAX_LIVE=40\",
            \"LIVE_OK=0\",
            \"while [ \$LIVE_ATTEMPTS -lt \$MAX_LIVE ]; do\",
            \"  LIVE_ATTEMPTS=\$((LIVE_ATTEMPTS + 1))\",
            \"  HTTP_CODE=\$(curl -s --max-time 10 -o /tmp/new_live.json -w '%{http_code}' http://localhost:\$NEW_PORT/health/live 2>/dev/null || echo '000')\",
            \"  if [ \\\"\$HTTP_CODE\\\" = \\\"200\\\" ]; then\",
            \"    APP_STATUS=\$(cat /tmp/new_live.json | jq -r '.status' 2>/dev/null || echo 'unknown')\",
            \"    echo \\\"Liveness \$LIVE_ATTEMPTS/\$MAX_LIVE: HTTP \$HTTP_CODE app=\$APP_STATUS\\\"\",
            \"    if [ \\\"\$APP_STATUS\\\" = \\\"OK\\\" ]; then\",
            \"      LIVE_OK=1\",
            \"      break\",
            \"    fi\",
            \"  else\",
            \"    echo \\\"Liveness \$LIVE_ATTEMPTS/\$MAX_LIVE: HTTP \$HTTP_CODE - waiting...\\\"\",
            \"  fi\",
            \"  sleep 3\",
            \"done\",
            \"if [ \$LIVE_OK -ne 1 ]; then\",
            \"  echo 'Liveness check timed out - rolling back'\",
            \"  docker logs overpower-app-new --tail 30 || true\",
            \"  docker stop overpower-app-new || true\",
            \"  docker rm overpower-app-new || true\",
            \"  echo \\\"Old container still serving on port \$CURRENT_PORT\\\"\",
            \"  exit 1\",
            \"fi\",
            \"echo '--- Step 3b: Readiness (SELECT 1, 3 consecutive OK) ---'\",
            \"MAX_ATTEMPTS=40\",
            \"ATTEMPT=0\",
            \"PASSED=0\",
            \"CONSEC_OK=0\",
            \"REQUIRED_CONSEC=3\",
            \"while [ \$ATTEMPT -lt \$MAX_ATTEMPTS ]; do\",
            \"  ATTEMPT=\$((ATTEMPT + 1))\",
            \"  HTTP_CODE=\$(curl -s --max-time 15 -o /tmp/new_health.json -w '%{http_code}' http://localhost:\$NEW_PORT/health/ready 2>/dev/null || echo '000')\",
            \"  if [ \\\"\$HTTP_CODE\\\" = \\\"200\\\" ]; then\",
            \"    APP_STATUS=\$(cat /tmp/new_health.json | jq -r '.status' 2>/dev/null || echo 'unknown')\",
            \"    DB_STATUS=\$(cat /tmp/new_health.json | jq -r '.database.status' 2>/dev/null || echo 'unknown')\",
            \"    echo \\\"Ready \$ATTEMPT/\$MAX_ATTEMPTS: HTTP \$HTTP_CODE | app=\$APP_STATUS db=\$DB_STATUS consec=\$CONSEC_OK/\$REQUIRED_CONSEC\\\"\",
            \"    if [ \\\"\$APP_STATUS\\\" = \\\"OK\\\" ] && [ \\\"\$DB_STATUS\\\" = \\\"OK\\\" ]; then\",
            \"      CONSEC_OK=\$((CONSEC_OK + 1))\",
            \"      if [ \$CONSEC_OK -ge \$REQUIRED_CONSEC ]; then\",
            \"        PASSED=1\",
            \"        break\",
            \"      fi\",
            \"    else\",
            \"      CONSEC_OK=0\",
            \"    fi\",
            \"  else\",
            \"    CONSEC_OK=0\",
            \"    echo \\\"Ready \$ATTEMPT/\$MAX_ATTEMPTS: HTTP \$HTTP_CODE - waiting...\\\"\",
            \"  fi\",
            \"  sleep 5\",
            \"done\",
            \"if [ \$PASSED -ne 1 ]; then\",
            \"  echo 'Readiness check timed out - rolling back'\",
            \"  docker logs overpower-app-new --tail 30 || true\",
            \"  docker stop overpower-app-new || true\",
            \"  docker rm overpower-app-new || true\",
            \"  echo \\\"Old container still serving on port \$CURRENT_PORT\\\"\",
            \"  exit 1\",
            \"fi\",
            \"echo 'New container is ready'\",
            \"NEW_COMMIT=\$(cat /tmp/new_health.json | jq -r '.git.commit // \\\"\\\"' 2>/dev/null || echo '')\",
            \"echo \\\"New container health commit: \${NEW_COMMIT:-unknown}\\\"\",
            \"echo \\\"Expected commit: $IMAGE_TAG\\\"\",
            \"echo '--- Step 4: Switch nginx traffic ---'\",
            \"sed -i \\\"s/localhost:\$CURRENT_PORT/localhost:\$NEW_PORT/g\\\" /etc/nginx/conf.d/excelsior.cards.conf\",
            \"nginx -t\",
            \"nginx -s reload\",
            \"echo \\\"Traffic switched to port \$NEW_PORT\\\"\",
            \"echo '--- Step 5: Finalize ---'\",
            \"docker stop overpower-app || true\",
            \"docker rm overpower-app || true\",
            \"docker rename overpower-app-new overpower-app\",
            \"echo \$NEW_PORT > /opt/app/active_port\",
            \"docker image prune -af || true\",
            \"echo \\\"Active port: \$(cat /opt/app/active_port)\\\"\",
            \"docker ps\",
            \"echo '=== Blue-Green Deploy Complete ==='\"
          ]" \
          --output text --query 'Command.CommandId')

        echo "SSM Command ID: $CMD_ID"
        if [ -z "$CMD_ID" ]; then
          echo "ERROR: aws ssm send-command returned an empty command ID — deploy command was never sent."
          exit 1
        fi

        echo "Polling SSM command status (max 1200s)..."
        DEPLOY_DONE=0
        for i in $(seq 1 240); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id ${{ env.EC2_INSTANCE_ID }} \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "[$i/240] Deploy status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            DEPLOY_DONE=1
            break
          fi
          if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command ended with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE_ID }} \
              --query 'StandardOutputContent' --output text || true
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE_ID }} \
              --query 'StandardErrorContent' --output text || true
            exit 1
          fi
          sleep 5
        done
        if [ $DEPLOY_DONE -ne 1 ]; then
          echo "ERROR: SSM deploy command did not complete within the 1200s polling window (last status: ${STATUS:-unknown})"
          echo "SSM Command ID: $CMD_ID"
          echo "Check the AWS SSM console or CloudWatch for this command's output."
          exit 1
        fi
        echo "Deploy polling complete."

    - name: Verify Deployment
      run: |
        echo "Verifying deployment via production health endpoint..."
        EXPECTED_COMMIT="${{ github.sha }}"
        echo "Expected commit: $EXPECTED_COMMIT"
        echo "Expected image tag: $EXPECTED_COMMIT"

        # Allow time for nginx/cache to serve the new container after SSM reports Success
        echo "Waiting 25s for traffic to switch to new container..."
        sleep 25

        SUCCESS=0
        DEPLOYED_COMMIT=""
        HTTP_STATUS=""
        LAST_HEALTH=""
        for i in $(seq 1 20); do
          CACHE_BUSTER=$(date +%s%N)
          # Apex is behind CloudFront (HTTP → 301 to HTTPS); use HTTPS for JSON health
          HEALTH_URL="https://excelsior.cards/health?cb=$CACHE_BUSTER"
          HEALTH=$(curl -s --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$HEALTH_URL" 2>/dev/null || echo "")
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$HEALTH_URL" 2>/dev/null || echo "000")
          DEPLOYED_COMMIT=$(echo "$HEALTH" | jq -r '.git.commit // ""' 2>/dev/null || echo "")
          LAST_HEALTH="$HEALTH"

          echo "[$i/20] HTTP: $HTTP_STATUS | deployed: ${DEPLOYED_COMMIT:-none} | expected: $EXPECTED_COMMIT"

          if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
            echo "Deployment verified: commit $DEPLOYED_COMMIT is live on production"
            SUCCESS=1
            break
          fi

          sleep 10
        done

        if [ $SUCCESS -ne 1 ]; then
          echo "Deployment verification failed"
          echo "Production is running: ${DEPLOYED_COMMIT:-unknown}"
          echo "Expected: $EXPECTED_COMMIT"
          echo "Last HTTP status: ${HTTP_STATUS:-unknown}"
          echo "Last health URL: ${HEALTH_URL:-unknown}"
          echo "Last health response (first 500 chars):"
          echo "$LAST_HEALTH" | head -c 500
          echo ""
          echo "Collecting EC2 deployment diagnostics..."
          DIAG_CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo Active port: $(cat /opt/app/active_port 2>/dev/null || echo unknown)",
              "echo Nginx upstream: $(grep -o \"localhost:[0-9]*\" /etc/nginx/conf.d/excelsior.cards.conf | head -1)",
              "docker ps --format \"table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\""
            ]' \
            --output text --query 'Command.CommandId' 2>/dev/null || echo "")
          if [ -n "$DIAG_CMD_ID" ]; then
            sleep 8
            aws ssm get-command-invocation \
              --command-id "$DIAG_CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE_ID }} \
              --query 'StandardOutputContent' --output text || true
          fi
          echo "If the deploy actually succeeded, production may be on the new commit but verification hit DNS/cache. Check EC2 container and nginx. Otherwise check SSM/CloudWatch for the blue-green deploy step."
          exit 1
        fi

    - name: Deployment success notification
      run: |
        echo "Deployment completed and verified!"
        echo "Application URL: https://excelsior.cards"
        echo "Deployed commit: ${{ github.sha }}"

  post-production:
    name: Post Production
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
        
    - name: Call health check endpoint
      run: |
        echo "🏥 Calling health check endpoint on production server..."
        echo "=========================================="
        
        # Wait a bit for server to be fully ready after deployment
        echo "⏳ Waiting 15 seconds for server to be fully ready..."
        sleep 15
        
        MAX_RETRIES=3
        RETRY_DELAY=30
        ATTEMPT=0
        SUCCESS=0
        
        while [ $ATTEMPT -le $MAX_RETRIES ]; do
          if [ $ATTEMPT -gt 0 ]; then
            echo "⏳ Retry attempt $ATTEMPT of $MAX_RETRIES after waiting $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          fi
          
          echo "🔎 Health check attempt $((ATTEMPT+1))..."
          HEALTH_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 10 "https://excelsior.cards/health" || echo "HTTP_STATUS:000")
          
          # Extract HTTP status code
          HTTP_STATUS=$(echo "$HEALTH_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          HEALTH_BODY=$(echo "$HEALTH_RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "📊 Health Check Results (attempt $((ATTEMPT+1))):"
          echo "========================"
          echo "HTTP Status Code: $HTTP_STATUS"
          echo ""
          echo "Response Body:"
          echo "$HEALTH_BODY" | jq . 2>/dev/null || echo "$HEALTH_BODY"
          echo ""
          
          # Check for specific error conditions
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️  Connection failed - server may not be responding or DNS issue"
          elif [ "$HTTP_STATUS" = "503" ]; then
            echo "⚠️  Service Unavailable - server may be starting or database connection issue"
            # Try to extract error message from response
            ERROR_MSG=$(echo "$HEALTH_BODY" | jq -r '.error // .database.error // "Unknown error"' 2>/dev/null || echo "Unknown error")
            echo "   Error details: $ERROR_MSG"
          elif [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️  Unexpected HTTP status: $HTTP_STATUS"
          fi
          
          echo "=========================================="
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check PASSED - Server is healthy"
            SUCCESS=1
            break
          else
            echo "❌ Health check FAILED - Server may not be ready (HTTP $HTTP_STATUS)"
          fi
          
          ATTEMPT=$((ATTEMPT+1))
        done
        
        if [ $SUCCESS -eq 1 ]; then
          exit 0
        else
          echo "❌ Health check FAILED after $((MAX_RETRIES+1)) attempts"
          echo "💡 Troubleshooting tips:"
          echo "   - Check if server is running: curl -I https://excelsior.cards"
          echo "   - Check server logs on EC2 instance"
          echo "   - Verify database connectivity"
          echo "   - Check DNS resolution for excelsior.cards"
          exit 1
        fi
        
    - name: Post-production verification complete
      run: |
        echo "✅ Post-production verification completed successfully!"
        echo "🌐 Production server is healthy and responding"
        echo "📊 Full health check details displayed above"
